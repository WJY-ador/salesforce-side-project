<template>
    <lightning-card title="사용 장비" icon-name="standard:product">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="header-row slds-m-bottom_medium">
                <div>
                    <p class="section-title">Instrument Product Overview</p>
                    <p class="section-help">카드를 클릭하면 제품 상세 페이지로 이동합니다.</p>
                </div>
            </div>

            <div class="card-grid">
                <template for:each={products} for:item="product">
                    <article
                        key={product.key}
                        class="instrument-card"
                        data-key={product.key}
                        onclick={handleNavigate}
                        onkeydown={handleKeyDown}
                        tabindex="0"
                        role="button"
                        aria-label={product.name}
                    >
                        <div class="product-top">
                            <div class="product-icon-wrap">
                                <lightning-icon
                                    icon-name={product.iconName}
                                    size="small"
                                    alternative-text={product.name}
                                ></lightning-icon>
                            </div>

                            <div class="product-badges">
                                <span class="type-badge">Instrument</span>
                            </div>
                        </div>

                        <div class="product-body">
                            <h3 class="product-name">{product.name}</h3>
                            <p class="product-subtitle">{product.subtitle}</p>
                            <p class="product-description">{product.description}</p>
                        </div>

                        <div class="product-footer">
                            <div class="product-id-row">
                                <span class="footer-label">Product ID</span>
                                <span class="footer-value">{product.productId}</span>
                            </div>

                            <div class="cta-row">
                                <span class="cta-text">상세 보기</span>
                                <lightning-icon
                                    icon-name="utility:chevronright"
                                    size="x-small"
                                    alternative-text="상세 보기"
                                ></lightning-icon>
                            </div>
                        </div>
                    </article>
                </template>
            </div>
        </div>
    </lightning-card>
</template>
